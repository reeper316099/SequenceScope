<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="SequenceScope icon: two aligned sequence bars resolving into a small branching tree">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B1F6B"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <!-- two aligned sequence bars (left); the gap in the lower bar is an alignment gap -->
  <g fill="#FFFFFF">
    <rect x="120" y="360" width="90" height="70" rx="18"/><rect x="226" y="360" width="90" height="70" rx="18"/><rect x="332" y="360" width="90" height="70" rx="18"/>
    <rect x="120" y="594" width="90" height="70" rx="18"/><rect x="332" y="594" width="90" height="70" rx="18"/>
  </g>
  <rect x="226" y="618" width="90" height="22" rx="11" fill="#F59E0B"/>
  <!-- match lines between the bars -->
  <g stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.85">
    <line x1="165" y1="448" x2="165" y2="576"/><line x1="377" y1="448" x2="377" y2="576"/>
  </g>
  <!-- bars resolve into a tree (right) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M440 395 H560"/><path d="M440 629 H560"/>
    <path d="M560 395 V629"/>
    <path d="M560 512 H650"/>
    <path d="M650 512 V380 H780"/><path d="M650 512 V644 H780"/>
    <path d="M730 380 V300 H830"/><path d="M730 380 V460 H830"/>
  </g>
  <g fill="#F59E0B" stroke="#FFFFFF" stroke-width="12">
    <circle cx="845" cy="300" r="34"/><circle cx="845" cy="460" r="34"/><circle cx="800" cy="644" r="34"/>
  </g>
</svg>
