name: Release

# Pushing a tag like v0.1.0 builds UNSIGNED installers on Linux, Windows, and macOS and publishes them to that tag's GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag must match package.json version
        shell: bash
        run: |
          V="$(node -p "require('./package.json').version")"
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json version $V"; exit 1; fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Package and publish installers
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  checksums:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Compute SHA256SUMS for the release assets and upload them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.exe' --pattern '*.dmg' --pattern '*.AppImage' --pattern '*.deb'
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
