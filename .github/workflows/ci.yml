name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and property tests
        run: npm test
      - name: Install xvfb (virtual display for Electron)
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Electron end-to-end tests under xvfb
        run: xvfb-run -a npm run test:e2e
        env:
          CI: 'true'
